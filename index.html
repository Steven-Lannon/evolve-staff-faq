<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evolve Psychiatry Staff FAQ</title>
<style>
:root {
  --accent: #2D6A6A;
  --accent-hover: #1f4d4d;
  --accent-soft: #E7F0EF;
  --bg: #FAFAF9;
  --card: #FFFFFF;
  --ink: #1C2B33;
  --muted: #5B6B72;
  --label: #5B6B72;
  --line: #DCE3E3;
  --mark: #E7F0EF;
  --mark-ink: #2D6A6A;
  --draft-bg: #FFF3D6;
  --draft-ink: #7A5300;
  --on-accent: #FFFFFF;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 900px; margin: 0 auto; padding: 32px 20px; }
.logo { display: block; height: 36px; width: auto; margin-bottom: 16px; }
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
.intro { margin: 0 0 14px; color: var(--muted); font-size: 14px; }

.search { position: relative; margin-bottom: 18px; }
.search svg { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search input {
  width: 100%;
  font: inherit; font-size: 16px;
  color: var(--ink);
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 10px;
  padding: 14px 76px 14px 16px;
  outline: none;
  transition: border-color .15s ease;
}
.search input::placeholder { color: var(--muted); opacity: .8; }
.search input:focus { border-color: var(--accent); }
.search input::-webkit-search-cancel-button { display: none; }
.clear {
  position: absolute; right: 40px; top: 50%; transform: translateY(-50%);
  border: 0; background: transparent; color: var(--muted);
  width: 30px; height: 30px; cursor: pointer; font-size: 20px; line-height: 1; border-radius: 6px;
  display: none;
}
.clear.show { display: block; }
.clear:hover { color: var(--ink); }

.filter-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 18px; }
.filter-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-right: 4px; }
.filter-btn {
  border: 1.5px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font: inherit; font-size: 13px; font-weight: 600;
  padding: 6px 14px;
  border-radius: 100px;
  cursor: pointer;
  transition: background .15s ease, border-color .15s ease, color .15s ease;
}
.filter-btn:hover { border-color: var(--accent); }
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

.status { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; font-size: 13px; color: var(--muted); }
.reset-btn { font: inherit; font-size: 13px; font-weight: 600; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
.reset-btn:hover { color: var(--accent-hover); }

.list { list-style: none; margin: 0; padding: 0; }
.umbrella { margin: 0 0 32px; }
.umbrella-title { margin: 18px 0 16px; padding-bottom: 10px; font-size: 26px; font-weight: 700; color: #3A3E43; letter-spacing: -0.02em; border-bottom: 4px solid var(--accent); }
.sections { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.umbrella-empty { background: var(--card); border: 1px dashed var(--line); border-radius: 10px; padding: 18px 16px; color: var(--muted); font-size: 14px; }
.section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.sec-head {
  width: 100%; display: flex; align-items: center; gap: 10px;
  background: none; border: 0; color: inherit; font: inherit; text-align: left;
  padding: 14px 16px; cursor: pointer;
}
.sec-icon { width: 38px; height: 38px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex-shrink: 0; }
.sec-icon svg { width: 20px; height: 20px; }
.sec-text { display: flex; flex-direction: column; line-height: 1.25; }
.sec-title { font-size: 16px; font-weight: 700; color: var(--ink); }
.sec-count { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.sec-head .chev { margin-left: auto; }
.sec-head { gap: 14px; padding: 14px 16px; }
.sec-head:hover .sec-title { color: var(--accent); }
.section.open > .sec-head .sec-icon { background: var(--accent); color: #FFFFFF; }
.q-text { font-weight: 500; }
.section.open > .sec-head .chev { transform: rotate(180deg); }
.rows { display: none; list-style: none; margin: 0; padding: 0; }
.section.open .rows { display: block; }
.row { border-top: 1px solid var(--line); transition: background .15s ease; }
.row.open { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.row.open .q-text { color: var(--ink); font-weight: 700; }
.row.open .q:hover .q-text { color: var(--ink); }
.row.open .q .chev { color: var(--accent); }
.q {
  width: 100%;
  display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center;
  text-align: left;
  background: none; border: 0; color: inherit; font: inherit;
  padding: 11px 16px;
  cursor: pointer;
}
.q:hover .q-text { color: var(--accent); }
.q-text { font-size: 14.5px; font-weight: 600; line-height: 1.4; color: var(--ink); }
.draft { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 100px; background: var(--draft-bg); color: var(--draft-ink); vertical-align: 1px; }
.prov-only { display: inline-block; margin-left: 8px; font-size: 11px; font-weight: 700; letter-spacing: .02em; padding: 2px 8px; border-radius: 100px; background: #FDE4E2; color: #B42318; border: 1px solid #F7C6C1; vertical-align: 1px; white-space: nowrap; }
.chev { width: 16px; height: 16px; color: var(--muted); transition: transform .2s ease; flex-shrink: 0; }
.row.open .q .chev { transform: rotate(180deg); }
.a { display: none; padding: 0 16px 14px; }
.row.open .a { display: block; }
.a-body { color: var(--ink); font-size: 14px; }
.a p { margin: 0 0 10px; max-width: 72ch; }
.a ul { margin: 0 0 10px; padding-left: 20px; max-width: 72ch; }
.a li { margin-bottom: 4px; }
.a a { color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
.a a:hover { color: var(--accent-hover); }
.a-img-sm { width: auto !important; max-width: 100%; }
.a-img { display: block; max-width: 100%; width: 340px; height: auto; margin: 4px 0 12px; border: 1px solid var(--line); border-radius: 8px; background: #FFFFFF; }
.a a.guide-btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--accent); color: #FFFFFF;
  font-size: 14px; font-weight: 600; text-decoration: none;
  padding: 9px 18px; border-radius: 8px;
  transition: background .15s ease;
}
.a a.guide-btn::after { content: "↗"; font-size: 15px; line-height: 1; }
.a a.guide-btn:hover { background: var(--accent-hover); color: #FFFFFF; }
.a-foot { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-end; font-size: 12.5px; color: var(--muted); margin-top: 12px; }
.a-foot b { color: var(--ink); font-weight: 600; }
.copy {
  margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
  font: inherit; font-size: 12.5px; font-weight: 600;
  background: var(--card); color: var(--accent);
  border: 1.5px solid var(--accent); border-radius: 100px;
  padding: 5px 13px; cursor: pointer;
  transition: background .15s ease, color .15s ease;
}
.copy svg { width: 14px; height: 14px; }
.copy:hover, .copy.done { background: var(--accent); color: #FFFFFF; }
mark { background: var(--mark); color: var(--mark-ink); padding: 0 2px; border-radius: 3px; }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }
.empty strong { display: block; color: var(--ink); margin-bottom: 4px; }

.help { margin-top: 28px; font-size: 14px; color: var(--muted); text-align: center; }
.help strong { color: var(--ink); }

@media (max-width: 480px) {
  .wrap { padding: 20px 14px; }
  h1 { font-size: 19px; }
  .q { padding: 12px; }
  .a { padding: 0 12px 12px; }
  .sec-head { padding: 12px; gap: 12px; }
  .filter-label { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { .chev, .filter-btn, .search input { transition: none; } }
</style>
</head>

  { id: "pto-start", category: "Time Off & Attendance", roles: ["All Staff"],
    q: "When can I start using PTO and sick time?",
    a: "<p>After your 90-day introductory period. Sick leave starts accruing on your first day, but you can't use it until the 90 days are up.</p>",
    keywords: "new hire probation introductory period 90 days eligible", source: "Handbook §3.7, §7.6, §7.7" },
  { id: "call-out", category: "Time Off & Attendance", roles: ["All Staff"],
    q: "How do I call out sick or let my manager know I'll be late?",
    a: "<p>Call the Evolve Psychiatry Call-Out and Emergency Line at <strong>631-479-3406</strong> at least 2 hours before your scheduled start time. If no one answers, leave a voicemail. Texts, Slack messages, and emails don't count as notice.</p><p>For any last-minute absence, you also need to complete an <a href=\"https://form.jotform.com/241064635802048\" target=\"_blank\" rel=\"noopener\">Absence Form</a>. Let them know how long you expect to be out and when you'll be back.</p>",
    keywords: "sick late callout call out absent notify text slack email tardy phone number emergency line voicemail absence form", source: "Handbook §4.1" },
  { id: "high-impact", category: "Time Off & Attendance", roles: ["All Staff"],
    q: "What are high-impact days?",
    a: "<p>Mondays and the day after a holiday. PTO for these days must be requested in advance, and call-outs aren't accepted. Your manager may ask you to come in unless it's a real emergency, and you'll need documentation of that emergency before returning.</p>",
    keywords: "monday holiday call out callout", source: "Handbook §4.1" },
  { id: "write-ups", category: "Time Off & Attendance", roles: ["All Staff"],
    q: "How many call-outs or late arrivals lead to a write-up?",
    a: "<ul><li>3 call-outs in a 6-month period: the third triggers an automatic write-up.</li><li>3 late arrivals in a 3-month period: the third triggers an automatic write-up.</li><li>3 consecutive sick days: you'll need a doctor's note.</li></ul>",
    keywords: "writeup discipline late tardy callout doctors note absence", source: "Handbook §4.1" },
  { id: "arrive-early", category: "Time Off & Attendance", roles: ["All Staff"],
    q: "How early should I arrive for my shift?",
    a: "<p>5 to 10 minutes before your scheduled start, ready to work.</p>",
    keywords: "arrive shift start on time punctual", source: "Handbook §4.1" },
  { id: "schedule-posted", category: "Time Off & Attendance", roles: ["All Staff"],
    q: "When is my schedule posted, and where can I see it?",
    a: "<p>Reception, TMS, and other department schedules are posted once a month, covering the whole month. You can view the schedule anytime on the Evolve Office website or <a href=\"https://docs.google.com/spreadsheets/d/11HihFUnBQyIgwfn8pCv-dmP78lZeOlWWOhF5GuPL3Es/edit?usp=sharing\" target=\"_blank\" rel=\"noopener\">open the schedule here</a>. Get your PTO and sick requests in before it's posted.</p><p>Provider, billing, administration, and NPC schedules are set before your start date and only change if administration directs it.</p>",
    keywords: "schedule monthly shifts posted where view website", source: "Handbook §4.7" },
  { id: "short-staffed", category: "Time Off & Attendance", roles: ["All Staff"],
    q: "Why was my PTO request limited during a busy period?",
    a: "<p>During short-staffing periods, Administration may approve PTO for only one staff member per location at a time, first come, first served.</p>",
    keywords: "denied pto short staffed busy one per location", source: "Handbook §4.1" },
  { id: "pto-carryover", category: "Time Off & Attendance", roles: ["All Staff"],
    q: "Can I carry unused PTO into next year?",
    a: "<p>You can carry over half of your unused PTO. Alternatively, half of your unused PTO may be paid out at year end instead of carried over.</p>",
    keywords: "rollover roll over unused payout year end", source: "Handbook §7.6" },
  { id: "holidays", category: "Time Off & Attendance", roles: ["All Staff"],
    q: "What are the paid holidays?",
    a: "<p>New Year's Day, Memorial Day, July 4th, Labor Day, Thanksgiving, Christmas Day, plus one floating holiday.</p><p>If you work four 10-hour days, you're paid 10 hours when a holiday lands on a normal workday. If it lands on your day off, ask your manager how it applies to you.</p>",
    keywords: "holiday christmas thanksgiving july 4 new years labor memorial", source: "Handbook §7.5" },
  { id: "floating-holiday", category: "Time Off & Attendance", roles: ["All Staff"],
    q: "How does the floating holiday work?",
    a: "<p>You get one paid floating holiday a year to use on a day of your choosing, such as Christmas Eve, New Year's Eve, Juneteenth, MLK Day, or Columbus Day. Give 2 weeks' notice before taking it.</p>",
    keywords: "floating holiday juneteenth christmas eve mlk", source: "Handbook §7.5" },
  { id: "leaving-pto", category: "Time Off & Attendance", roles: ["All Staff"],
    q: "What happens to my PTO and sick time if I leave?",
    a: "<p>Unused PTO and sick time aren't paid out when you resign or are terminated. You also can't use PTO or sick time during your last 2 weeks.</p>",
    keywords: "resign quit two weeks notice payout termination", source: "Handbook §5.7, §7.6, §7.7" },

  // ---------- Pay & Benefits ----------
  { id: "payday", category: "Pay & Benefits", roles: ["All Staff"],
    q: "When is payday?",
    a: "<p>Every other Thursday. If payday falls on a holiday, you're paid the workday before. If you're not sure when the next payday is, check the front page of the Evolve Office website.</p>",
    keywords: "paycheck pay date biweekly direct deposit", source: "Handbook, NY & NC Pay Period" },
  { id: "clock-in", category: "Pay & Benefits", roles: ["All Staff"],
    q: "Who has to clock in, and how?",
    a: "<p>All employees must clock in and out for every shift, except salaried employees and independent contractors. Clock in and out using your <a href=\"https://login.flex.paychex.com/login_static/UsernameOnly.html?lang=en&downtime=false\" target=\"_blank\" rel=\"noopener\">Paychex account</a> on your assigned office computer.</p><p>Clock in no more than 5 minutes before you start working and out no more than 5 minutes after you stop. Record your meal break too. Any time you actually work is recorded and paid, including work outside those 5-minute windows or during a meal break.</p><p>Never clock in or out for another employee; doing so leads to termination.</p>",
    keywords: "paychex timeclock punch time card clock in out hours salary salaried hourly contractor exempt nonexempt", source: "Handbook §4.8" },
  { id: "overtime", category: "Pay & Benefits", roles: ["All Staff"],
    q: "Can I work overtime?",
    a: "<p>Only with written approval from your manager in advance. In New York offices, no more than 2 hours of overtime per pay period is approved unless there's an extenuating circumstance. The practice may also require overtime at times, with as much notice as possible.</p>",
    keywords: "overtime ot extra hours approval", source: "Handbook, Overtime" },
  { id: "lunch", category: "Pay & Benefits", roles: ["All Staff"],
    q: "Is my lunch break paid?",
    a: "<p>In New York offices, full-time employees get a paid 30-minute lunch. Clock out and back in for it, and tell your manager if you can't take it.</p>",
    keywords: "lunch meal break paid 30 minutes", source: "Handbook, NY Meal Periods" },
  { id: "mileage", category: "Pay & Benefits", roles: ["All Staff"],
    q: "Do I get reimbursed for driving to another office?",
    a: "<p>Yes, at $0.74 per mile when you're asked to cover at another location. Mileage to required in-person staff meetings isn't reimbursed.</p>",
    keywords: "mileage gas travel reimbursement coverage", source: "Handbook §4.2" },
  { id: "401k", category: "Pay & Benefits", roles: ["All Staff"],
    q: "When can I join the 401(k)?",
    a: "<p>You can start contributing to the 401(k) after 3 months of employment. Once you reach 1 year, Evolve matches your contributions up to 4%. To qualify for the match, you must contribute at least 5%.</p><p>Sign up and manage your contributions in your <a href=\"https://login.flex.paychex.com/login_static/UsernameOnly.html?lang=en&downtime=false\" target=\"_blank\" rel=\"noopener\">Paychex account</a> under the Retirement section. You can also view the Summary Plan Description there.</p>",
    keywords: "401k retirement match contribute 4% 5% paychex enroll sign up spd summary plan", source: "Handbook §7.2" },
  { id: "health", category: "Pay & Benefits", roles: ["All Staff"],
    q: "When does health insurance start?",
    a: "<p>After the plan's waiting period, which follows your 90-day introductory period. Ask the Practice Manager for the Summary Plan Description.</p>",
    keywords: "health insurance medical benefits coverage", source: "Handbook §3.7, §7.4" },
  { id: "personal-info", category: "Pay & Benefits", roles: ["All Staff"],
    q: "How do I update my address or tax withholding?",
    a: "<p>You can do so in your <a href=\"https://login.flex.paychex.com/login_static/UsernameOnly.html?lang=en&downtime=false\" target=\"_blank\" rel=\"noopener\">Paychex account</a> under <strong>My Pay &gt; Taxes</strong>.</p>",
    keywords: "address phone w4 w-4 tax withholding change", source: "Handbook §6.7" },

  // ---------- Leave ----------
  { id: "sick-leave", category: "Leave", roles: ["All Staff"],
    q: "How does sick leave work?",
    a: "<ul><li>You earn 1 hour for every 30 hours worked, starting day one.</li><li>You can use it after 90 days, up to 40 hours per calendar year, in 1-hour minimums.</li><li>It covers your own or a family member's illness, care, or preventive care, and safe leave situations.</li><li>Unused hours carry over, but the 40-hour yearly use limit still applies.</li></ul>",
    keywords: "sick time accrual family member doctor", source: "Handbook §7.7" },
  { id: "jury-duty", category: "Leave", roles: ["All Staff"],
    q: "Am I paid for jury duty?",
    a: "<p>Evolve pays $72 per day for the first 3 days. Tell your manager as soon as you're summoned, and you may be asked for proof of service.</p>",
    keywords: "jury summons court", source: "Handbook §7.1" },
  { id: "pfl", category: "Leave", roles: ["All Staff"],
    q: "What is New York Paid Family Leave?",
    a: "<p>For New York staff: up to 12 weeks of job-protected leave at 67% of your weekly pay (capped) to bond with a new child, care for a family member with a serious health condition, or help with a family member's military deployment.</p><p>Full-time employees are eligible after 26 consecutive weeks; part-time after 175 days worked.</p>",
    keywords: "pfl paid family leave baby bonding maternity paternity", source: "Handbook, NY Paid Family Leave" },
  { id: "fmla", category: "Leave", roles: ["All Staff"],
    q: "Am I eligible for FMLA?",
    a: "<p>If you've worked here at least 12 months and at least 1,250 hours in the last 12 months. FMLA is unpaid, job-protected leave of up to 12 weeks, and you can use PTO or sick time during it.</p><p>Give 30 days' notice when you can. Get leave forms from the Practice Manager.</p>",
    keywords: "fmla medical leave family unpaid", source: "Handbook §7.3" },

  // ---------- IT & Accounts ----------
  { id: "personal-wifi", category: "IT & Accounts", roles: ["All Staff"],
    q: "Can I connect my phone or laptop to the office Wi-Fi?",
    a: "<p>No. Personal devices can't connect to the practice network or to practice equipment like computers and printers.</p>",
    keywords: "wifi wi-fi internet network phone personal device printer", source: "Handbook §6.6" },
  { id: "shared-login", category: "IT & Accounts", roles: ["All Staff"],
    q: "Can a coworker use my login if I say it's okay?",
    a: "<p>No. Nobody may log into another employee's computer, email, EMR, Paychex, or any other account, even with permission. Don't share passwords. Using someone else's EMR login can also be a HIPAA violation.</p>",
    keywords: "password login share account credentials emr", source: "Handbook §6.1" },
  { id: "imessage", category: "IT & Accounts", roles: ["All Staff"],
    q: "Can I use iMessage or FaceTime on my office Mac?",
    a: "<p>No. iMessage and FaceTime aren't permitted on practice computers.</p>",
    keywords: "imessage facetime mac apple messages", source: "Handbook §6.6" },
  { id: "remote-access", category: "IT & Accounts", roles: ["All Staff"],
    q: "Why are Splashtop and Rippling on my computer?",
    a: "<p>They let IT and authorized support providers maintain, update, troubleshoot, and secure practice computers, including remotely and without prior notice. Practice devices and accounts may be monitored, so there's no expectation of privacy on them.</p>",
    keywords: "splashtop rippling remote access monitoring privacy", source: "Handbook §6.1" },
  { id: "software", category: "IT & Accounts", roles: ["All Staff"],
    q: "How do I get new software installed?",
    a: "<p>Get your manager's approval first. All software is purchased through IT.</p>",
    keywords: "install app program software purchase license", source: "Handbook §6.1" },

  // ---------- Remote ----------
  { id: "vpn", category: "IT & Accounts", roles: ["Remote"],
    q: "Do I need to use a VPN?",
    a: "<p>Yes, if you're a full-time remote worker.</p>",
    keywords: "vpn remote home work from home", source: "Handbook, HIPAA Remote Work" },
  { id: "telehealth-setup", category: "HIPAA & Compliance", roles: ["Remote", "Provider", "Therapist"],
    q: "What do I need for telehealth sessions from home?",
    a: "<ul><li>A private, enclosed room</li><li>Headphones during patient encounters</li><li>A screen nobody else can see</li><li>Practice-approved, encrypted devices and platforms only</li><li>No patient information stored on personal devices unless authorized</li></ul>",
    keywords: "telehealth remote home video visit headphones private room", source: "Handbook, HIPAA Remote Work" },

  // ---------- HIPAA & Compliance ----------
  { id: "own-chart", category: "HIPAA & Compliance", roles: ["All Staff"],
    q: "Can I look up my own or a family member's chart?",
    a: "<p>No. Only access patient information you need for your job. That rules out your own record, family members' records, and anyone else's without a business reason.</p>",
    keywords: "chart record emr look up family minimum necessary", source: "Handbook, HIPAA" },
  { id: "employee-patient", category: "HIPAA & Compliance", roles: ["All Staff"],
    q: "Can I be seen as a patient at Evolve?",
    a: "<p>Generally no. You may choose medication management or TMS at Evolve, but charts can't be locked in our EMR, so other employees may be able to see yours. Talk therapy and Spravato aren't available to current employees.</p>",
    keywords: "employee patient treatment chart privacy", source: "Handbook, HIPAA" },
  { id: "breach", category: "HIPAA & Compliance", roles: ["All Staff"],
    q: "What do I do if I lose a device or think patient info was exposed?",
    a: "<p>Report it to the Practice Manager right away. This covers lost or stolen devices, suspected breaches, and unauthorized access.</p>",
    keywords: "lost stolen phone laptop breach privacy report hipaa", source: "Handbook, HIPAA" },

  // ---------- Patient Safety & Incidents ----------
  { id: "report-now", category: "Patient Safety & Incidents", roles: ["All Staff"],
    q: "What do I need to report to management right away?",
    a: "<ul><li>Patient complaints about safety or quality of care</li><li>Adverse events</li><li>Medication errors</li><li>HIPAA concerns</li><li>Regulatory inquiries</li></ul><p>Don't try to resolve a serious complaint on your own.</p>",
    keywords: "complaint incident error adverse event report", source: "Handbook, Incident Reporting" },
  { id: "threats", category: "Patient Safety & Incidents", roles: ["All Staff"],
    q: "A patient or visitor is threatening or escalating. What do I do?",
    a: "<p>Report it immediately, follow de-escalation and emergency procedures, and use panic or emergency protocols when needed. You won't be disciplined for reporting a safety concern in good faith.</p>",
    keywords: "threat violence aggressive escalation panic emergency", source: "Handbook §8.3, Workplace Violence" },
  { id: "boundaries", category: "Patient Safety & Incidents", roles: ["All Staff"],
    q: "Can I accept a gift from a patient or follow them on social media?",
    a: "<p>No significant gifts, no social media interaction with current patients, and no personal relationships with current patients.</p>",
    keywords: "gift social media instagram facebook boundaries patient", source: "Handbook, Professional Boundaries" },

  // ---------- Office & Conduct ----------
  { id: "dress-code", category: "Office & Conduct", roles: ["Reception", "TMS/Spravato"],
    q: "What's the dress code for reception and TMS?",
    a: "<p>Black scrubs with closed-toe shoes. Black leggings, hoodies, and clothing with holes aren't allowed. Blue jeans are fine on casual Fridays.</p>",
    keywords: "dress code scrubs uniform clothes jeans casual friday", source: "Handbook §6.5" },
  { id: "phones", category: "Office & Conduct", roles: ["All Staff"],
    q: "Can I use my personal phone at work?",
    a: "<p>Only on breaks and lunch, or for something urgent. You can use the office phone for necessary personal calls. Excessive personal phone use leads to a write-up.</p>",
    keywords: "cell phone mobile personal break", source: "Handbook §6.6" },
  { id: "closures", category: "Office & Conduct", roles: ["All Staff"],
    q: "How will I find out if the office is closed for weather?",
    a: "<p>By Slack and email. Make sure at least one of them is on your phone.</p>",
    keywords: "snow weather closed closure storm power outage", source: "Handbook §8.1" },

  // ================= ECW =================
  { id: "ecw-my-providers", group: "ECW", category: "General", roles: ["All Staff"],
    q: "Add or remove providers from ‘My Providers’ list",
    a: "<p><a class=\"guide-btn\" href=\"https://scribehow.com/o/duSl3Y2vQmOHv3Xca6TcFA/viewer/How_to_add_missing_providers_to_My_Providers_list__quVZHqOrTByFLwxy4NNfRQ\" target=\"_blank\" rel=\"noopener\">Click here for guide</a></p>",
    keywords: "ecw eclinicalworks my providers list add remove missing provider resource schedule view scribe guide", source: "" },
  { id: "ecw-what-is-te", group: "ECW", category: "General", roles: ["All Staff"],
    q: "What is a telephone encounter?",
    a: "<p>A Telephone Encounter (T) is a way to document and manage patient-related communications or requests in eClinicalWorks. It's essentially a task or message attached to a patient's chart.</p><p>Common examples include:</p><ul><li><strong>Medication refills:</strong> a patient requests a prescription refill.</li><li><strong>Patient questions:</strong> a patient asks about their medication or treatment.</li><li><strong>Provider requests:</strong> staff need a provider to review or address something.</li><li><strong>Follow-ups:</strong> documenting a phone conversation or an action that's needed.</li></ul><p><strong>Important:</strong> a Telephone Encounter doesn't necessarily mean a phone call happened. It's also used to communicate and track patient-related tasks between staff and providers.</p><p>Once the request is addressed, the T can be completed and closed.</p><p>You can find telephone encounters under the <strong>T</strong> in the top bar of eCW:</p><img class=\"a-img a-img-sm\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAARgAAACnCAYAAADKZUOYAACHiElEQVR42uz9d7wlR3XuD3+rqrv33ifPnJkzOUqjLI0yCEkIIRFEMtEYDBgbBzAXbIx57c9rv+8P++KL8702tuFiG4wxyQaEiQIkIZRQjqMZjTRRk/OJO3R31fr9Ud29++w5I80ICc2IXfoczQk79K6uemqtZ631LHXx7/+tCIISABANogRwIP73WkAJKFGIaFCgEFAKp7PHKkAUohT+B8AJCsHhMDrAuYBKtY80TUlsHW0c4ixadPs5RzEEsEpl3zkUgnGgJUBhcAqcFpwSnIYgTdEiIP5DilI4rbFK+88h4t/dOZQyqOK1wf/FUAlmkdo6qZ1AK0FhEFGofOKO6sItgp8jUf4d8vlFuexaFKBJjQAKYw3aqWJ2/HMdomB2dYJXzbuLK4Yf4Y6Dp/Cd3RcxmvRkc6kBg4ki0rjpXxuXv8iTXqZSCsnmCuWKZyqts185lEg2R/k1K8SAoFHOoB3FmnKa9hpR2ZyK83Mn2l+ryh6DoHSVIOghaY7RHzZ4ydwHuHrkQR6eWMrXtl/O7ubQkadYQWr859SObG2BIIiyiDgUGi0GbSNEOZx206ZECah8SQNohdWgcBgn2dzmn8nPj0hIEPSgtCZOJkGlGKePemloZwCwWrL7m89tvgdV8VmcUrh8/WR7sdi/+e0Vyb53aO3nXKH945xDiFAqBOfoiWokOx8n3fkouDS7t0dxzalDh4YGKVXRxFqRAqbZ5ODubYyPjxNIvuhoX6ES8QtBsi2slP8gki8pKW6a37TtDUC+8MT/1t848RtKiX9O/jsRRByg/fdHv1XR+ZVkM+uUwgOlzW64FCDncqBQ+aJRHhxQKPFTrxCUUjgk+9z5vGS7QuWfWyFYBJ19hqO7Xr/l2+Cb41175lR2jf7fYsEo50E/v0OGAihX9OzgvKFN const ROLES = ["Provider", "Therapist", "Reception", "TMS/Spravato", "Billing", "Admin", "Remote"];

const state = { query: "", roles: new Set() };
const $ = s => document.querySelector(s);

function esc(s) { return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function stripTags(html) { const d = document.createElement("div"); d.innerHTML = html; return d.textContent; }
function terms() { return state.query.toLowerCase().split(/\s+/).filter(Boolean); }
function reEsc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

// Highlight only inside text nodes so HTML tags stay intact
function highlightHTML(html, words) {
  if (!words.length) return html;
  const re = new RegExp("(" + words.map(reEsc).join("|") + ")", "gi");
  return html.split(/(<[^>]+>)/).map(part => part.startsWith("<") ? part : part.replace(re, "<mark>$1</mark>")).join("");
}

function matchesRole(item) {
  if (!state.roles.size) return true;
  return item.roles.includes("All Staff") || item.roles.some(r => state.roles.has(r));
}
function matchesQuery(item, words) {
  if (!words.length) return true;
  const hay = (item.q + " " + stripTags(item.a) + " " + item.keywords + " " + item.category + " " + item.roles.join(" ") + (item.providerOnly ? " providers only provider only" : "")).toLowerCase();
  return words.every(w => hay.includes(w));
}
const GROUPS = ["Policies", "General", "ECW"];
const GROUP_LABELS = { Policies: "Staff Policies", General: "General FAQ", ECW: "ECW Guides" };   // filter bubble text
const GROUP_TITLES = { Policies: "Staff Policies", General: "General FAQ", ECW: "ECW Guides" };   // section titles
state.groups = new Set();
state.providersOnly = false;   // TEMPORARY: "Providers only" filter
const groupOf = i => i.group || "Policies";
function allGroups() { return state.groups.size === 0; }

function filtered() {
  const words = terms();
  return FAQ.filter(i => (allGroups() || state.groups.has(groupOf(i))) && (!state.providersOnly || i.providerOnly) && matchesRole(i) && matchesQuery(i, words));
}

function renderFilters() {
  const box = $("#groups"); box.innerHTML = "";
  GROUPS.forEach(g => {
    const active = state.groups.has(g);
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "filter-btn" + (active ? " active" : "");
    btn.setAttribute("aria-pressed", active ? "true" : "false");
    btn.textContent = GROUP_LABELS[g] || g;
    btn.addEventListener("click", () => {
      state.groups = active ? new Set() : new Set([g]);       // select only this one; click again to show all
      state.providersOnly = false;
      render();
    });
    box.append(btn);
  });

  // TEMPORARY: "Providers only" filter — delete this block to remove it
  const pb = document.createElement("button");
  pb.type = "button"; pb.className = "filter-btn prov-filter" + (state.providersOnly ? " active" : "");
  pb.setAttribute("aria-pressed", state.providersOnly ? "true" : "false");
  pb.textContent = "Providers Only";
  pb.addEventListener("click", () => { state.providersOnly = !state.providersOnly; state.groups = new Set(); render(); });
  box.append(pb);
}

    "Patient Portal": w('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>'),
    "Troubleshooting": w('<path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>'),
    "Progress Notes": w('<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>'),
    _: w('<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.7M12 17h.01"/>')
  };
})();
const SECTION_ORDER = ["General", "Time Off & Attendance", "Pay & Benefits", "Leave", "IT & Accounts", "HIPAA & Compliance", "Patient Safety & Incidents", "Office & Conduct", "Troubleshooting", "Progress Notes", "Patient Portal", "RX", "Scheduling"];
const openSections = new Set();
const openItems = new Set();
let lastSig = null;

function renderList() {
  const list = $("#list"); list.innerHTML = "";
  const items = filtered();
  const words = terms();
  const filtering = !!state.query || state.providersOnly;

  const sig = state.query + "|" + [...state.groups].join(",") + "|" + state.providersOnly;
  if (sig !== lastSig) {
    lastSig = sig;
    openSections.clear();
    if (filtering) items.forEach(i => openSections.add(groupOf(i) + "::" + i.category));
    if (words.length && items.length <= 3) items.forEach(i => openItems.add(i.id));
  }

  $("#count").textContent = `Showing ${items.length} ${items.length === 1 ? "question" : "questions"}`;
  $("#reset").hidden = !(state.query || !allGroups() || state.providersOnly);

  let rendered = 0;
  GROUPS.filter(g => allGroups() || state.groups.has(g)).forEach(g => {
    const gItems = items.filter(i => groupOf(i) === g);
    if (!gItems.length && (state.query || state.providersOnly)) return;

    const um = document.createElement("li");
    um.className = "umbrella";
    um.innerHTML = `<h2 class="umbrella-title">${esc(GROUP_TITLES[g] || g + " FAQ")}</h2>`;
    rendered++;

    if (!gItems.length) {
      um.insertAdjacentHTML("beforeend", `<div class="umbrella-empty">No ${esc(g)} questions yet.</div>`);
      list.append(um);
      return;
    }

    const secList = document.createElement("ul");
    secList.className = "sections";
    const cats = [...SECTION_ORDER.filter(c => gItems.some(i => i.category === c)),
                  ...new Set(gItems.map(i => i.category).filter(c => !SECTION_ORDER.includes(c)))];

    cats.forEach(cat => {
      const group = gItems.filter(i => i.category === cat);
      const key = g + "::" + cat;
      const isOpenSec = openSections.has(key);
      const sec = document.createElement("li");
      sec.className = "section" + (isOpenSec ? " open" : "");
      const secId = "sec-" + (g + "-" + cat).toLowerCase().replace(/[^a-z]+/g, "-");
      sec.innerHTML = `
        <button class="sec-head" type="button" aria-expanded="${isOpenSec}" aria-controls="${secId}">
          <span class="sec-icon">${SEC_ICONS[cat] || SEC_ICONS._}</span>
          <span class="sec-text"><span class="sec-title">${esc(cat)}</span><span class="sec-count">${group.length} ${group.length === 1 ? "question" : "questions"}</span></span>${CHEV}
        </button>
        <ul class="rows" id="${secId}"></ul>`;
      sec.querySelector(".sec-head").addEventListener("click", () => {
        openSections.has(key) ? openSections.delete(key) : openSections.add(key);
        renderList();
      });
      const rows = sec.querySelector(".rows");

      group.forEach(i => {
        const li = document.createElement("li");
        const isOpen = openItems.has(i.id);
        li.className = "row" + (isOpen ? " open" : ""); li.id = i.id;
        li.innerHTML = `
          <button class="q" type="button" aria-expanded="${isOpen}" aria-controls="a-${i.id}">
            <span class="q-text">${highlightHTML(esc(i.q), words)}${i.providerOnly ? '<span class="prov-only">Providers Only</span>' : ""}${i.draft ? '<span class="draft">Draft</span>' : ""}</span>
            ${CHEV}
          </button>
          <div class="a" id="a-${i.id}" role="region">
            <div class="a-body">
              ${highlightHTML(i.a, words)}
              <div class="a-foot">
                <span><b>Role:</b> ${esc(i.roles.join(", "))}</span>
                ${i.source ? `<span>Source: ${esc(i.source)}</span>` : ""}
                <button class="copy" type="button">${SHARE_ICON}<span>Share Question</span></button>
              </div>
            </div>
          </div>`;
        li.querySelector(".q").addEventListener("click", e => {
          const nowOpen = li.classList.toggle("open");
          nowOpen ? openItems.add(i.id) : openItems.delete(i.id);
          e.currentTarget.setAttribute("aria-expanded", nowOpen);
        });
        li.querySelector(".copy").addEventListener("click", e => {
          const url = location.href.split("#")[0] + "#" + i.id;
          const btn = e.currentTarget, label = btn.querySelector("span");
          const done = () => {
            label.textContent = "Link copied"; btn.classList.add("done");
            setTimeout(() => { label.textContent = "Share Question"; btn.classList.remove("done"); }, 1600);
          };
          if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, () => prompt("Copy this link:", url));
          else prompt("Copy this link:", url);
        });
        rows.append(li);
      });
      secList.append(sec);
    });
    um.append(secList);
    list.append(um);
  });

  if (!rendered) {
    list.innerHTML = `<li class="empty"><strong>No questions match${state.query ? ` “${esc(state.query)}”` : ""}.</strong>Try fewer words, or reset the filters to search everything.</li>`;
  }
}

function render() { renderFilters(); renderList(); }

let t;
$("#q").addEventListener("input", e => {
  clearTimeout(t);
  $("#clear").classList.toggle("show", !!e.target.value);
  t = setTimeout(() => { state.query = e.target.value.trim(); renderList(); }, 120);
});
$("#clear").addEventListener("click", () => { $("#q").value = ""; state.query = ""; $("#clear").classList.remove("show"); $("#q").focus(); render(); });
$("#reset").addEventListener("click", () => {
  $("#q").value = ""; $("#clear").classList.remove("show");
  state.query = ""; state.roles.clear(); state.groups = new Set(); state.providersOnly = false; render();
});

const linked = FAQ.find(i => "#" + i.id === location.hash);
render();
if (linked) { openSections.add(groupOf(linked) + "::" + linked.category); openItems.add(linked.id); renderList(); }
if (location.hash) {
  const el = document.getElementById(location.hash.slice(1));
  if (el) el.scrollIntoView({ block: "center" });
}
</script>
</body>
